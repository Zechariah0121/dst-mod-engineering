name: Tool checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Python test dependency
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q scripts tests prepare_sources.py run_kb.py dst-kb-service/dst_kb
      - name: Run unit tests with synthetic fixtures (no DST installation)
        run: python -m unittest discover -s tests -v
      - name: Verify public knowledge integrity and corruption rejection
        run: python -B -m unittest discover -s knowledge/tests -v
      - name: Build single complete release and verify reproducibility
        run: |
          python -B scripts/build_release.py
          python -B scripts/build_release.py --check
      - name: Test read-only knowledge retrieval
        working-directory: dst-kb-service
        run: python -B -m unittest discover -s tests -v
